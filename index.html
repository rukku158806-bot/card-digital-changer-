<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE IDENTITY | Master Business Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --accent: #d4af37; --bg: #050505; --card-inner: #111; }
        .is-basic { --accent: #888 !important; }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: #fff; 
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden; perspective: 1200px;
        }

        /* --- 3D LIVE PREVIEW AREA --- */
        .preview-section {
            width: 100%; padding: 60px 0; display: flex; flex-direction: column; align-items: center;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
            border-bottom: 1px solid #222;
        }

        .tier-label {
            font-size: 0.6rem; font-weight: 900; letter-spacing: 3px; color: var(--accent);
            border: 1px solid var(--accent); padding: 5px 15px; border-radius: 30px; margin-bottom: 25px;
        }

        .card-3d {
            width: 340px; height: 210px; background: var(--card-inner); border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); padding: 30px; box-sizing: border-box;
            position: relative; transform-style: preserve-3d; transition: transform 0.1s ease-out;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .card-chip { width: 50px; height: 38px; background: linear-gradient(135deg, #a17e1d, var(--accent)); border-radius: 8px; margin-bottom: 15px; }
        .prev-name { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .prev-title { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 4px; margin-top: 5px; font-weight: 700; }
        .prev-qr { position: absolute; bottom: 25px; right: 25px; background: #fff; padding: 4px; border-radius: 6px; }

        /* --- THE CUSTOMIZER WORKSHOP --- */
        .workshop { width: 100%; max-width: 440px; padding: 30px; box-sizing: border-box; }
        .section-header { font-size: 0.65rem; color: #555; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin: 25px 0 10px 0; display: block; }
        
        input, select { 
            width: 100%; padding: 16px; background: #111; border: 1px solid #222; 
            color: white; border-radius: 14px; font-size: 1rem; margin-bottom: 15px;
        }

        .pro-locked { opacity: 0.4; pointer-events: none; border: 1px dashed #333; padding: 15px; border-radius: 15px; position: relative; }
        .pro-locked::after { content: "PRO ONLY"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 900; color: var(--accent); font-size: 0.7rem; letter-spacing: 2px; }

        .btn-main { width: 100%; padding: 22px; background: var(--accent); color: #000; border: none; border-radius: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 20px; }
        .btn-pdf { background: none; border: 1px solid #333; color: #666; width: 100%; padding: 15px; border-radius: 18px; margin-top: 15px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="preview-section">
        <div id="badge" class="tier-label">BASIC IDENTITY</div>
        
        <div class="card-3d" id="tilt-card">
            <div class="card-chip"></div>
            <h1 id="v-name" class="prev-name">CLIENT NAME</h1>
            <p id="v-title" class="prev-title">PROFESSIONAL</p>
            <div class="prev-qr" id="qrcode"></div>
        </div>
    </div>

    <div class="workshop">
        <span class="section-header">Identity Details</span>
        <input type="text" id="i-name" placeholder="Full Name" oninput="live()">
        <input type="text" id="i-title" placeholder="Job Title" oninput="live()">

        <div id="pro-zone" class="pro-locked">
            <span class="section-header" style="color:var(--accent)">★ Visual Customization (Pro)</span>
            <select id="i-color" onchange="live()">
                <option value="#d4af37">Classic Gold</option>
                <option value="#00d4ff">Electric Blue</option>
                <option value="#a855f7">Royal Purple</option>
                <option value="#ffffff">Platinum White</option>
            </select>

            <span class="section-header" style="color:var(--accent)">★ Events & Socials (Pro)</span>
            <input type="text" id="i-event" placeholder="Booking Link (Calendly)" oninput="live()">
            <input type="text" id="i-social" placeholder="Instagram URL" oninput="live()">
        </div>

        <span class="section-header">Security Gate</span>
        <input type="password" id="i-pin" placeholder="Set 4-Digit Master PIN" maxlength="4">

        <button class="btn-main" onclick="save()">Save Design & Lock</button>
        <button id="pdf-btn" class="btn-pdf" onclick="pdf()" style="display:none;">Download Master Recovery PDF</button>
    </div>

<script>
    const DB_KEY = 'fortress_master_v1';
    const params = new URLSearchParams(window.location.search);
    const isPro = params.get('tier') === 'pro';

    let data = JSON.parse(localStorage.getItem(DB_KEY)) || {
        name: "VALUED CLIENT", title: "IDENTITY SECURED", color: "#888", pin: "1234", event: "", social: ""
    };

    // 3D Tilt Logic
    const card = document.getElementById('tilt-card');
    document.addEventListener('mousemove', (e) => {
        let x = (window.innerWidth / 2 - e.pageX) / 20;
        let y = (window.innerHeight / 2 - e.pageY) / 20;
        card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    function init() {
        if (isPro) {
            document.getElementById('badge').innerText = "PRO IDENTITY";
            document.getElementById('badge').style.borderColor = "#d4af37";
            document.getElementById('pro-zone').classList.remove('pro-locked');
            document.getElementById('pdf-btn').style.display = "block";
        }
        document.getElementById('i-name').value = data.name;
        document.getElementById('i-title').value = data.title;
        document.getElementById('i-color').value = isPro ? data.color : "#888";
        live();
    }

    function live() {
        const name = document.getElementById('i-name').value || "CLIENT NAME";
        const title = document.getElementById('i-title').value || "PROFESSIONAL";
        const color = isPro ? document.getElementById('i-color').value : "#888";
        
        document.getElementById('v-name').innerText = name;
        document.getElementById('v-title').innerText = title;
        document.documentElement.style.setProperty('--accent', color);
    }

    function save() {
        data.name = document.getElementById('i-name').value;
        data.title = document.getElementById('i-title').value;
        if(isPro) {
            data.color = document.getElementById('i-color').value;
            data.event = document.getElementById('i-event').value;
            data.social = document.getElementById('i-social').value;
        }
        if(document.getElementById('i-pin').value) data.pin = document.getElementById('i-pin').value;
        
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        alert("Encrypted. Your card is ready.");
    }

    function pdf() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFillColor(0,0,0); doc.rect(0,0,210,297,'F');
        doc.setTextColor(212,175,55); doc.setFontSize(22);
        doc.text("MASTER SECURITY KEY", 20, 40);
        doc.setTextColor(255,255,255); doc.setFontSize(12);
        doc.text(`Card Holder: ${data.name}`, 20, 60);
        doc.text(`Master PIN: ${data.pin}`, 20, 75);
        doc.text(`Status: PRO TIER VERIFIED`, 20, 90);
        doc.save("MasterKey.pdf");
    }

    window.onload = () => {
        init();
        new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 55, height: 55 });
    };
</script>
</body>
</html>
