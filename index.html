<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart NFC OS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --card-w: 340px; --card-h: 210px;
            --gold: #d4af37; --platinum: #e5e4e2; --emerald: #50c878;
        }
        body {
            background: #000; color: #fff; font-family: sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* --- 3-SIDE CARD OS STAGE --- */
        .stage {
            perspective: 1200px; padding: 40px 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            background: radial-gradient(circle at center, #111, #000);
            position: sticky; top: 0; z-index: 100;
        }
        .card-container {
            width: var(--card-w); height: var(--card-h);
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-container.flipped { transform: rotateY(180deg); }
        .card-container.portrait { --card-w: 210px; --card-h: 340px; }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 15px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        /* --- SIDE 1: FRONT (IDENTITY + FLYER) --- */
        .side-front { background: #111; padding: 20px; z-index: 2; }
        .logo-slot { width: 50px; height: 50px; background: #222; margin-bottom: 10px; position: relative; }
        .logo-slot img { width: 100%; height: 100%; object-fit: contain; }
        .shimmer {
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer-swipe 3s infinite; display: none;
        }
        @keyframes shimmer-swipe { 100% { left: 200%; } }
        .flyer-zone { margin-top: auto; max-height: 80px; overflow-y: auto; font-size: 0.6rem; color: #aaa; }
        .flyer-item { border-top: 1px solid #333; padding: 4px 0; }

        /* --- SIDE 2: BACK (CONTACT HUB) --- */
        .side-back { background: #0a0a0a; transform: rotateY(180deg); padding: 15px; }
        .hub-section { margin-bottom: 10px; }
        .hub-label { font-size: 0.5rem; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        .hub-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
        .hub-item { 
            background: #222; padding: 4px 8px; border-radius: 4px; font-size: 0.6rem;
            display: flex; align-items: center; gap: 5px; text-decoration: none; color: #fff;
        }

        /* --- SIDE 3: SYSTEM (UNKILLABLE) --- */
        .system-layer { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        #qr-container { background: #fff; padding: 8px; border-radius: 4px; cursor: default; }
        .pro-qr { cursor: pointer !important; }

        /* --- THE WORKSHOP --- */
        .workshop { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        .field { margin-bottom: 15px; }
        label { font-size: 0.7rem; color: var(--gold); display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { 
            width: 100%; background: #111; border: 1px solid #333; color: #fff; 
            padding: 12px; border-radius: 8px; box-sizing: border-box;
        }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { 
            padding: 15px; border-radius: 8px; border: 1px solid #333; background: #222; 
            color: #fff; font-weight: bold; cursor: pointer; text-align: center; font-size: 0.7rem;
        }
        .btn-master { background: var(--gold); color: #000; border: none; grid-column: span 2; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="stage">
    <div class="card-container" id="main-card">
        <div class="face side-front" id="card-front">
            <div class="shimmer" id="shimmer-fx"></div>
            <div class="logo-slot" id="logo-display"></div>
            <h2 id="v-name" style="margin:0; font-size: 1.2rem;">NAME</h2>
            <p id="v-title" style="margin:2px 0; font-size: 0.7rem; color: #888;">TITLE</p>
            <p id="v-slogan" style="margin:0; font-size: 0.6rem; color: var(--gold); letter-spacing: 1px;">SLOGAN</p>
            <div class="flyer-zone" id="v-flyers"></div>
        </div>
        <div class="face side-back">
            <div class="hub-section">
                <div class="hub-label">Phones</div>
                <div class="hub-list" id="v-phones"></div>
            </div>
            <div class="hub-section">
                <div class="hub-label">Socials</div>
                <div class="hub-list" id="v-socials"></div>
            </div>
            <div class="hub-section">
                <div class="hub-label">Websites</div>
                <div class="hub-list" id="v-webs"></div>
            </div>
        </div>
    </div>

    <div class="system-layer">
        <div id="qr-container"></div>
        <button class="btn" style="margin-top:10px; font-size:0.5rem;" onclick="downloadPDF()">GENERATE RECOVERY PDF</button>
    </div>
</div>

<div class="workshop">
    <div class="field">
        <label>Identity</label>
        <input type="text" id="i-name" placeholder="Name" oninput="liveUpdate()">
        <input type="text" id="i-title" placeholder="Title" oninput="liveUpdate()">
        <input type="text" id="i-slogan" placeholder="Slogan" oninput="liveUpdate()">
    </div>

    <div class="field">
        <label>Logo Upload</label>
        <input type="file" accept="image/*" onchange="uploadLogo(event)">
    </div>

    <div class="field">
        <label>Style (Tier Locked)</label>
        <select id="i-style" onchange="liveUpdate()"></select>
    </div>

    <div class="field">
        <label>Material (Tier Locked)</label>
        <select id="i-material" onchange="liveUpdate()"></select>
    </div>

    <div class="field">
        <label>Contact Hub (Phone / Social / Web)</label>
        <div style="display:flex; gap:5px;">
            <select id="slot-type" style="width:30%;">
                <option value="phone">Phone</option>
                <option value="social">Social</option>
                <option value="web">Web</option>
            </select>
            <input type="text" id="slot-val" placeholder="Value (e.g. +123 or @handle)">
            <button class="btn" onclick="addSlot()">+</button>
        </div>
    </div>

    <div class="field">
        <label>Upcoming Events (Max 3)</label>
        <input type="text" id="ev-title" placeholder="Event Title">
        <input type="text" id="ev-date" placeholder="Date">
        <button class="btn" style="width:100%; margin-top:5px;" onclick="addEvent()">ADD EVENT</button>
    </div>

    <div class="field">
        <label>Master Security PIN</label>
        <input type="password" id="i-pin" maxlength="4" placeholder="4-Digit PIN">
    </div>

    <div class="btn-group">
        <div class="btn" onclick="toggleFlip()">FLIP CARD</div>
        <div class="btn" onclick="toggleOrientation()">ORIENTATION</div>
        <div class="btn btn-master" onclick="saveSystem()">LOCK IDENTITY</div>
    </div>
</div>

<script>
    const TIER = new URLSearchParams(window.location.search).get('tier') || 'basic';
    const KEY = 'nfc_os_data';
    let db = JSON.parse(localStorage.getItem(KEY)) || {
        name: "PERFORMER", title: "IDENTITY PRO", slogan: "EXCELLENCE ALWAYS",
        logo: null, style: "Gold Luxe", material: "Carbon Fiber", pin: "0000",
        phones: [], socials: [], webs: [], events: []
    };

    function init() {
        renderSelectors();
        loadDB();
        generateQR();
        applyTierRestrictions();
        setupTilt();
    }

    function renderSelectors() {
        const s = document.getElementById('i-style');
        const m = document.getElementById('i-material');
        const styles = ["Gold Luxe", "Modern Wave", "Abstract Energy", "Luxury Card"];
        const materials = ["Carbon Fiber", "Gold Leaf", "Frosted Glass", "Midnight Blue"];
        
        if (TIER === 'pro') {
            styles.push("John Butler", "Abstract Flow");
            materials.push("Platinum", "Emerald");
        }
        
        styles.forEach(opt => s.innerHTML += `<option value="${opt}">${opt}</option>`);
        materials.forEach(opt => m.innerHTML += `<option value="${opt}">${opt}</option>`);
    }

    function loadDB() {
        document.getElementById('i-name').value = db.name;
        document.getElementById('i-title').value = db.title;
        document.getElementById('i-slogan').value = db.slogan;
        document.getElementById('i-style').value = db.style;
        document.getElementById('i-material').value = db.material;
        document.getElementById('i-pin').value = db.pin;
        if(db.logo) document.getElementById('logo-display').innerHTML = `<img src="${db.logo}">`;
        liveUpdate();
    }

    function liveUpdate() {
        document.getElementById('v-name').innerText = document.getElementById('i-name').value || "NAME";
        document.getElementById('v-title').innerText = document.getElementById('i-title').value || "TITLE";
        document.getElementById('v-slogan').innerText = document.getElementById('i-slogan').value || "SLOGAN";
        
        // Render Hubs
        renderList('v-phones', db.phones, 'tel:');
        renderList('v-socials', db.socials, 'https://');
        renderList('v-webs', db.webs, 'https://');
        
        // Render Events
        const evZone = document.getElementById('v-flyers');
        evZone.innerHTML = "";
        db.events.slice(-3).forEach(ev => {
            evZone.innerHTML += `<div class="flyer-item"><b>${ev.t}</b><br>${ev.d}</div>`;
        });
    }

    function renderList(id, arr, prefix) {
        const el = document.getElementById(id);
        el.innerHTML = "";
        arr.forEach((item, idx) => {
            const link = item.includes('://') ? item : prefix + item;
            el.innerHTML += `<div class="hub-item"><a href="${link}" style="color:inherit;text-decoration:none">${item}</a><span onclick="removeSlot('${id}', ${idx})" style="color:red;cursor:pointer">✕</span></div>`;
        });
    }

    function addSlot() {
        const type = document.getElementById('slot-type').value;
        const val = document.getElementById('slot-val').value;
        if(!val) return;
        if(type === 'phone' && db.phones.length < 5) db.phones.push(val);
        if(type === 'social' && db.socials.length < 5) db.socials.push(val);
        if(type === 'web' && db.webs.length < 5) db.webs.push(val);
        document.getElementById('slot-val').value = "";
        liveUpdate();
    }

    function removeSlot(typeId, idx) {
        if(typeId === 'v-phones') db.phones.splice(idx, 1);
        if(typeId === 'v-socials') db.socials.splice(idx, 1);
        if(typeId === 'v-webs') db.webs.splice(idx, 1);
        liveUpdate();
    }

    function addEvent() {
        const t = document.getElementById('ev-title').value;
        const d = document.getElementById('ev-date').value;
        if(t && d && db.events.length < 10) {
            db.events.push({t, d});
            liveUpdate();
        }
    }

    function uploadLogo(e) {
        const reader = new FileReader();
        reader.onload = () => {
            db.logo = reader.result;
            document.getElementById('logo-display').innerHTML = `<img src="${db.logo}">`;
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function toggleFlip() { document.getElementById('main-card').classList.toggle('flipped'); }
    function toggleOrientation() { document.getElementById('main-card').classList.toggle('portrait'); }

    function applyTierRestrictions() {
        if (TIER === 'pro') {
            document.getElementById('shimmer-fx').style.display = 'block';
            document.getElementById('qr-container').classList.add('pro-qr');
            document.getElementById('qr-container').onclick = () => window.open(window.location.href);
        }
    }

    function generateQR() {
        new QRCode(document.getElementById("qr-container"), {
            text: window.location.href, width: 100, height: 100
        });
    }

    function saveSystem() {
        db.name = document.getElementById('i-name').value;
        db.title = document.getElementById('i-title').value;
        db.slogan = document.getElementById('i-slogan').value;
        db.style = document.getElementById('i-style').value;
        db.material = document.getElementById('i-material').value;
        db.pin = document.getElementById('i-pin').value;
        localStorage.setItem(KEY, JSON.stringify(db));
        alert("Identity Locked Locally.");
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("SMART NFC RECOVERY KEY", 20, 20);
        doc.text(`Identity: ${db.name}`, 20, 30);
        doc.text(`Master PIN: ${db.pin}`, 20, 40);
        doc.text("Store this offline. Use this PIN to self-
